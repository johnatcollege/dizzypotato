<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Egg Rally (Isometric)</title>
<style>
:root{--bg:#1d1a16;--ink:#f3e9d2;--hot:#ffb000;--dim:#8a7d66;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#1d1a16}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;overflow:hidden}
#wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
canvas{background:#6b8e3a;max-width:100%;max-height:100%;}
#hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;font-weight:bold;font-size:20px;text-shadow:2px 2px 0 #000;pointer-events:none}
#hud b{color:var(--hot)}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(20,16,10,.82);padding:20px}
#msg h1{font-size:clamp(30px,7vw,56px);margin:0 0 8px;color:var(--hot);letter-spacing:1px}
#msg p{max-width:460px;line-height:1.5;margin:6px 0;color:var(--ink)}
#msg button{margin-top:16px;font:inherit;font-weight:bold;font-size:20px;padding:12px 30px;background:var(--hot);color:#1d1a16;border:0;border-radius:4px;cursor:pointer}
#msg button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#touch{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:0;right:0;display:none;justify-content:space-between;padding:0 14px}
#touch div{display:flex;gap:10px}
#touch button{width:72px;height:72px;font-size:28px;border-radius:50%;border:2px solid var(--hot);background:rgba(0,0,0,.45);color:var(--ink);touch-action:none}
@media (pointer:coarse){#touch{display:flex}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="960" height="640"></canvas>
<div id="hud"><span>Stage <b id="st">1</b></span><span>Time <b id="tm">0</b></span><span><b id="sp">0</b> km/h</span><span>Check <b id="cp">0/0</b></span></div>
<div id="touch"><div><button id="bl">◀</button><button id="br">▶</button></div><div><button id="bb">■</button><button id="bg">▲</button></div></div>
<div id="msg"><h1>Egg Rally</h1><p>Hit every checkpoint before the clock runs out. Each one adds time. Stay on the dirt: grass and trees slow you down.</p><p>Arrow keys or WASD to run, space to skid-stop.</p><button id="go">Start engine</button></div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=480,H=320;
const $=id=>document.getElementById(id);
// Stages: control points of a closed loop (world units), road half-width
const STAGES=[
 {name:'Forest',road:34,grass:'#4f7a2e',dirt:'#b98b52',pts:[[0,0],[500,0],[800,200],[800,600],[500,800],[100,700],[-200,400],[-100,150]],time:38,add:18},
 {name:'Desert',road:38,grass:'#c9a15c',dirt:'#e3c58a',pts:[[0,0],[600,-100],[1000,100],[900,500],[500,600],[600,900],[100,1000],[-300,700],[-200,300]],time:42,add:20},
 {name:'Snow',road:30,grass:'#dfe8ee',dirt:'#8c97a1',pts:[[0,0],[400,-150],[800,0],[700,300],[1000,550],[700,850],[300,700],[0,950],[-300,600],[-100,250]],time:44,add:19}
];
let stage=0,track,car,keys={},time,running=false,checks,nextCheck,trees,skids,t0,over=false;
// Catmull-Rom spline sampling
function cr(p0,p1,p2,p3,t){const t2=t*t,t3=t2*t;return [0,1].map(i=>.5*((2*p1[i])+(-p0[i]+p2[i])*t+(2*p0[i]-5*p1[i]+4*p2[i]-p3[i])*t2+(-p0[i]+3*p1[i]-3*p2[i]+p3[i])*t3));}
function build(s){
 const P=s.pts,n=P.length,line=[];
 for(let i=0;i<n;i++)for(let k=0;k<24;k++)line.push(cr(P[(i+n-1)%n],P[i],P[(i+1)%n],P[(i+2)%n],k/24));
 // seeded trees
 let seed=7+stage*13;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 trees=[];
 for(let i=0;i<line.length;i+=2){for(const side of[-1,1]){
  const a=line[i],b=line[(i+1)%line.length];let dx=b[0]-a[0],dy=b[1]-a[1];const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
  const off=s.road+14+rnd()*50;
  if(rnd()<.55)trees.push([a[0]-dy*off*side,a[1]+dx*off*side,6+rnd()*5]);
 }}
 // checkpoints every ~1/6 of the loop
 checks=[];const step=Math.floor(line.length/6);
 for(let i=1;i<=6;i++)checks.push(line[(i*step)%line.length]);
 return line;
}
function nearest(x,y){let best=1e12,bi=0;for(let i=0;i<track.length;i++){const d=(track[i][0]-x)**2+(track[i][1]-y)**2;if(d<best){best=d;bi=i}}return [Math.sqrt(best),bi];}
function startStage(){
 const s=STAGES[stage];track=build(s);makeTex(s);dust=[];
 const a=track[0],b=track[1];
 car={x:a[0],y:a[1],ang:Math.atan2(b[1]-a[1],b[0]-a[0]),vx:0,vy:0,steer:0};
 time=s.time;nextCheck=0;skids=[];over=false;running=true;t0=performance.now();
 $('st').textContent=stage+1;
}
function showMsg(h,p,btn){$('msg').innerHTML='<h1>'+h+'</h1><p>'+p+'</p><button id="go">'+btn+'</button>';$('msg').style.display='flex';$('go').onclick=hide;$('go').focus();}
function hide(){$('msg').style.display='none';if(!running||over){if(over==='won'){stage=0}startStage();}}
$('go').onclick=()=>{$('msg').style.display='none';startStage();};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function bind(id,k){const b=$(id);const on=e=>{e.preventDefault();keys[k]=true},off=e=>{e.preventDefault();keys[k]=false};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);}
bind('bl','arrowleft');bind('br','arrowright');bind('bg','arrowup');bind('bb',' ');
let last=performance.now();
function step(dt){
 const up=keys.arrowup||keys.w,dn=keys.arrowdown||keys.s,lf=keys.arrowleft||keys.a,rt=keys.arrowright||keys.d,hb=keys[' '];
 const s=STAGES[stage];
 const [d]=nearest(car.x,car.y);
 const onRoad=d<s.road;
 // terrain grip & drag
 const grip=onRoad?(hb?1.2:5):2.5, drag=onRoad?.35:2.2;
 const fx=Math.cos(car.ang),fy=Math.sin(car.ang),rx=-fy,ry=fx;
 let fwd=car.vx*fx+car.vy*fy,lat=car.vx*rx+car.vy*ry;
 const accel=onRoad?190:90;
 if(up)fwd+=accel*dt;
 if(dn)fwd-=(fwd>0?300:110)*dt;
 fwd-=fwd*drag*dt;lat-=lat*Math.min(1,grip*dt);
 if(hb)fwd-=fwd*.8*dt;
 const sp=Math.hypot(fwd,lat);
 const target=(lf?-1:0)+(rt?1:0);
 car.steer+=(target-car.steer)*Math.min(1,8*dt);
 car.ang+=car.steer*Math.min(1,Math.abs(fwd)/60)*(fwd>=0?1:-1)*(hb?3.4:2.1)*dt;
 const fx2=Math.cos(car.ang),fy2=Math.sin(car.ang);
 car.vx=fx2*fwd+(-fy2)*lat;car.vy=fy2*fwd+fx2*lat;
 // trees
 for(const t of trees){const dx=car.x-t[0],dy=car.y-t[1],dd=Math.hypot(dx,dy);if(dd<t[2]+6){const nx=dx/dd,ny=dy/dd;const vn=car.vx*nx+car.vy*ny;if(vn<0){car.vx-=1.6*vn*nx;car.vy-=1.6*vn*ny;car.vx*=.6;car.vy*=.6}car.x+=nx*(t[2]+6-dd);car.y+=ny*(t[2]+6-dd);}}
 car.x+=car.vx*dt;car.y+=car.vy*dt;
 if(Math.abs(lat)>35||(hb&&sp>60))skids.push([car.x,car.y,Math.min(skids.length,0)]);
 if(skids.length>500)skids.splice(0,skids.length-500);
 // checkpoint
 const c=checks[nextCheck];
 if(Math.hypot(car.x-c[0],car.y-c[1])<s.road+12){
  nextCheck++;time+=s.add;
  if(nextCheck>=checks.length){running=false;over=stage===STAGES.length-1?'won':'next';
   if(over==='won')showMsg('Champion','You cleared all three stages. Time left on the last stage: '+time.toFixed(1)+' s.','Drive again');
   else{showMsg('Stage '+(stage+1)+' clear','Time banked: '+time.toFixed(1)+' s. Next up: '+STAGES[stage+1].name+'.','Next stage');stage++;}
  }
 }
 time-=dt;
 if(time<=0){running=false;over='lost';stage=stage;showMsg('Out of time','The clock beat you at checkpoint '+(nextCheck+1)+' of '+checks.length+'.','Retry stage');}
 car._sp=sp;car.run=(car.run||0)+sp*dt*.17;if(sp>45&&onRoad&&Math.random()<.8){const co=Math.cos(car.ang),si=Math.sin(car.ang);dust.push([car.x-co*11+(Math.random()-.5)*8,car.y-si*11+(Math.random()-.5)*8,1,Math.random()*3]);}for(const q of dust){q[2]-=dt*1.1;q[3]+=dt*12;}dust=dust.filter(q=>q[2]>0);
}
const T=192;let texG,texD,spr=[],dust=[];
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mk=(c,f)=>c.map(v=>Math.max(0,Math.min(255,v*f))|0);
const rgb=(a,al)=>'rgba('+a[0]+','+a[1]+','+a[2]+','+(al==null?1:al)+')';
const rng=sd=>{let s=sd;return()=>(s=(s*16807)%2147483647)/2147483647;};
function noiseTile(hx,sd,kind){
 const r=rng(sd),c=document.createElement('canvas');c.width=c.height=T;
 const g=c.getContext('2d'),im=g.createImageData(T,T),d=im.data,base=hex(hx),lo=mk(base,.74),hi=mk(base,1.2);
 const L=[6,12,24,48].map(n=>[n,Array.from({length:n*n},()=>r())]);
 const sm=t=>t*t*(3-2*t);
 const vn=(x,y,n,a)=>{const cs=T/n,fx=x/cs,fy=y/cs,x0=Math.floor(fx),y0=Math.floor(fy),tx=sm(fx-x0),ty=sm(fy-y0),q=(i,j)=>a[(j%n)*n+(i%n)];return(q(x0,y0)*(1-tx)+q(x0+1,y0)*tx)*(1-ty)+(q(x0,y0+1)*(1-tx)+q(x0+1,y0+1)*tx)*ty;};
 for(let y=0;y<T;y++)for(let x=0;x<T;x++){let v=0,w=.5,tot=0;for(const[n,a]of L){v+=vn(x,y,n,a)*w;tot+=w;w*=.62}v=Math.max(0,Math.min(1,(v/tot-.5)*2.4+.5));const sp=(r()-.5)*(kind?34:22),i=(y*T+x)*4;for(let k=0;k<3;k++)d[i+k]=lo[k]+(hi[k]-lo[k])*v+sp;d[i+3]=255;}
 g.putImageData(im,0,0);
 if(kind){for(let i=0;i<110;i++){const x=6+r()*(T-12),y=6+r()*(T-12),rr=.8+r()*2,lt=r()<.5;g.fillStyle=rgb(lt?hi:mk(base,.55),.55);g.beginPath();g.ellipse(x,y,rr*1.3,rr,r()*3,0,7);g.fill();}}
 else{g.lineWidth=1;for(let i=0;i<900;i++){const x=6+r()*(T-12),y=8+r()*(T-16),a=-1.57+(r()-.5)*.9,l=3+r()*5;g.strokeStyle=rgb(mk(base,.7+r()*.65),.55);g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();}}
 return c;
}
function makeTex(s){
 texG=ctx.createPattern(noiseTile(s.grass,11+stage,0),'repeat');texD=ctx.createPattern(noiseTile(s.dirt,29+stage,1),'repeat');
 const cols=[['#1b3714','#58a037'],['#5e4f26','#bda45e'],['#17332b','#4f8a72']][stage],lo=hex(cols[0]),hi=hex(cols[1]);
 spr=[];
 for(let v=0;v<4;v++){
  const r=rng(101+v*17+stage*5),c=document.createElement('canvas');c.width=c.height=56;const g=c.getContext('2d');
  g.fillStyle='#3b2a1a';g.fillRect(25,38,5,16);
  const bl=[];for(let k=0;k<52;k++){const a=r()*7,rad=Math.sqrt(r())*16;bl.push([28+Math.cos(a)*rad,24+Math.sin(a)*rad*.85,5+r()*5]);}
  bl.sort((a,b)=>a[1]-b[1]);
  for(const[bx,by,br]of bl){
   const t=Math.max(0,Math.min(1,.5+(28-bx)*.014+(24-by)*.022+(r()-.5)*.3)),col=lo.map((q,i)=>q+(hi[i]-q)*t);
   const gr=g.createRadialGradient(bx-br*.3,by-br*.3,br*.1,bx,by,br);
   gr.addColorStop(0,rgb(mk(col,1.25)));gr.addColorStop(.6,rgb(col));gr.addColorStop(1,rgb(mk(col,.55)));
   g.fillStyle=gr;g.beginPath();g.arc(bx,by,br,0,7);g.fill();
  }
  if(stage===2){g.fillStyle='rgba(245,250,255,.85)';for(let k=0;k<12;k++){g.beginPath();g.ellipse(18+r()*20,12+r()*12,2+r()*3,1.5+r()*1.5,0,0,7);g.fill();}}
  spr.push(c);
 }
}
function P(x,y,z){return [(x-y)*.866,(x+y)*.5-(z||0)];}
function poly(p,col){ctx.fillStyle=col;ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.fill();}
function lg(a,b,c0,c1){const g=ctx.createLinearGradient(a[0],a[1],b[0],b[1]);g.addColorStop(0,c0);g.addColorStop(1,c1);return g;}
function box(x,y,ang,hl,hw,z0,z1,top,side){
 const co=Math.cos(ang),si=Math.sin(ang);
 const cs=[[hl,hw],[hl,-hw],[-hl,-hw],[-hl,hw]].map(([a,b])=>[x+a*co-b*si,y+a*si+b*co]);
 const fs=[];for(let i=0;i<4;i++){const a=cs[i],b=cs[(i+1)%4];fs.push([a,b,a[0]+a[1]+b[0]+b[1]]);}
 fs.sort((p,q)=>p[2]-q[2]);
 fs.slice(2).forEach((f,k)=>{const p=[P(f[0][0],f[0][1],z0),P(f[1][0],f[1][1],z0),P(f[1][0],f[1][1],z1),P(f[0][0],f[0][1],z1)];poly(p,lg(p[3],p[0],side[k][0],side[k][1]));});
 const tp=cs.map(c=>P(c[0],c[1],z1)),xs=tp.map(q=>q[0]),ys=tp.map(q=>q[1]);
 poly(tp,typeof top==='string'?top:lg([Math.min(...xs),Math.min(...ys)],[Math.max(...xs),Math.max(...ys)],top[0],top[1]));
}
function draw(){
 ctx.setTransform(2,0,0,2,0,0);
 const s=STAGES[stage];
 ctx.fillStyle=s.grass;ctx.fillRect(0,0,W,H);
 if(!car)return;
 const cx=car.x+car.vx*.2,cy=car.y+car.vy*.2,cp=P(cx,cy,0),ox=W/2-cp[0],oy=H/2-cp[1];
 ctx.save();ctx.translate(ox,oy);ctx.transform(.866,.5,-.866,.5,0,0);
 ctx.fillStyle=texG;ctx.fillRect(cx-700,cy-700,1400,1400);
 ctx.lineCap='round';ctx.lineJoin='round';
 const path=()=>{ctx.beginPath();track.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();};
 ctx.globalAlpha=.4;ctx.strokeStyle=texD;ctx.lineWidth=s.road*2+22;path();ctx.stroke();ctx.globalAlpha=1;
 ctx.strokeStyle=texD;ctx.lineWidth=s.road*2;path();ctx.stroke();
 ctx.strokeStyle='rgba(50,32,14,.2)';ctx.lineWidth=s.road*1.35;path();ctx.stroke();
 ctx.strokeStyle='rgba(255,240,210,.07)';ctx.lineWidth=s.road*.5;path();ctx.stroke();
 ctx.fillStyle='rgba(25,15,5,.32)';for(const k of skids){ctx.beginPath();ctx.arc(k[0],k[1],1.7,0,7);ctx.fill();}
 ctx.restore();
 ctx.save();ctx.translate(ox,oy);
 const dc=hex(s.dirt);
 for(const q of dust){const p=P(q[0],q[1],q[3]+3),rad=6+(1-q[2])*16,g=ctx.createRadialGradient(p[0],p[1],0,p[0],p[1],rad);g.addColorStop(0,rgb(mk(dc,1.05),q[2]*.4));g.addColorStop(1,rgb(dc,0));ctx.fillStyle=g;ctx.fillRect(p[0]-rad,p[1]-rad,rad*2,rad*2);}
 const items=[];
 for(const t of trees){const q=P(t[0],t[1]);const sx=q[0]+ox,sy=q[1]+oy;if(sx>-50&&sx<W+50&&sy>-60&&sy<H+60)items.push([t[0]+t[1],0,t]);}
 for(let i=nextCheck;i<checks.length;i++)items.push([checks[i][0]+checks[i][1],1,i]);
 items.push([car.x+car.y,2]);
 items.sort((a,b)=>a[0]-b[0]);
 for(const it of items){
  if(it[1]===0){
   const t=it[2],p=P(t[0],t[1]),sc=t[2]/8*1.15,v=Math.abs(Math.floor(t[0]*.37+t[1]*.61))%4;
   ctx.save();ctx.translate(p[0],p[1]);ctx.transform(.866,.5,-.866,.5,0,0);ctx.fillStyle='rgba(0,0,0,.26)';ctx.beginPath();ctx.ellipse(t[2]*.9,t[2]*.5,t[2]*1.6,t[2]*1,0,0,7);ctx.fill();ctx.restore();
   ctx.drawImage(spr[v],p[0]-28*sc,p[1]-54*sc,56*sc,56*sc);
  }else if(it[1]===1){
   const i=it[2],c=checks[i],idx=nearest(c[0],c[1])[1],a=track[idx],b=track[(idx+1)%track.length];
   let dx=b[0]-a[0],dy=b[1]-a[1];const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
   const L=[c[0]-dy*s.road,c[1]+dx*s.road],R=[c[0]+dy*s.road,c[1]-dx*s.road],cur=i===nextCheck;
   ctx.strokeStyle=cur?'#e8e8e8':'#7a7366';ctx.lineWidth=3;
   for(const e of[L,R]){const g=P(e[0],e[1],0),h=P(e[0],e[1],22);ctx.beginPath();ctx.moveTo(g[0],g[1]);ctx.lineTo(h[0],h[1]);ctx.stroke();}
   const h1=P(L[0],L[1],22),h2=P(R[0],R[1],22);
   poly([h1,h2,[h2[0],h2[1]+8],[h1[0],h1[1]+8]],cur?lg(h1,h2,'#ffcc33','#e6761a'):'rgba(108,98,80,.7)');
  }else{
   const co=Math.cos(car.ang),si=Math.sin(car.ang),run=car.run||0,spd=Math.min(1,(car._sp||0)/90);
   const p=P(car.x,car.y,0),dxs=(co-si)*.866,dys=(co+si)*.5,ln=Math.hypot(dxs,dys)||1,dx=dxs/ln,dy=dys/ln;
   ctx.save();const sp0=P(car.x+1,car.y+1,0);ctx.translate(sp0[0],sp0[1]);ctx.transform(.866,.5,-.866,.5,0,0);
   const sg=ctx.createRadialGradient(0,0,1,0,0,11);sg.addColorStop(0,'rgba(0,0,0,.5)');sg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=sg;ctx.fillRect(-12,-12,24,24);ctx.restore();
   const bob=Math.abs(Math.sin(run))*3.2*spd,cx0=p[0],cy0=p[1]-17-bob,amp=6.5*spd;
   const limb=(x1,y1,x2,y2,w,col)=>{ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();};
   // legs
   for(const ph of[0,Math.PI]){
    const sw=Math.sin(run+ph)*amp,lift=Math.max(0,Math.cos(run+ph))*4.5*spd,hx=cx0+(ph?3:-3),hy=cy0+10,fx=hx+dx*sw,fy=p[1]-lift+dy*sw*.7;
    limb(hx,hy,fx,fy-2,3.2,'#efe2bf');
    ctx.fillStyle='#2467d6';ctx.beginPath();ctx.ellipse(fx+dx*1.5,fy-1,4.6,2.8,0,0,7);ctx.fill();
    ctx.fillStyle='#f5f5f5';ctx.fillRect(fx-1.5+dx*1.5,fy-2,3,1.2);
   }
   // body lean + egg shape
   ctx.save();ctx.translate(cx0,cy0);ctx.rotate(dx*.14*spd+car.steer*.06);
   const eg=ctx.createRadialGradient(-3.5,-6,1.5,0,1,15);eg.addColorStop(0,'#fffef6');eg.addColorStop(.55,'#f2e4c3');eg.addColorStop(1,'#bda36c');
   ctx.fillStyle=eg;ctx.beginPath();ctx.moveTo(0,-14);ctx.bezierCurveTo(8,-14,10.5,-1,10,5);ctx.bezierCurveTo(9.5,11,5,13.5,0,13.5);ctx.bezierCurveTo(-5,13.5,-9.5,11,-10,5);ctx.bezierCurveTo(-10.5,-1,-8,-14,0,-14);ctx.closePath();ctx.fill();
   ctx.strokeStyle='rgba(90,68,30,.45)';ctx.lineWidth=.8;ctx.stroke();
   ctx.fillStyle='rgba(120,90,40,.28)';for(const[a,b,r]of[[4,6,1],[-5,8,.8],[2,10,.7],[-3,-1,.7],[6,0,.6]]){ctx.beginPath();ctx.arc(a,b,r,0,7);ctx.fill();}
   // headband
   ctx.strokeStyle='#d93a2b';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,-7,8.3,2.4,0,0,7);ctx.stroke();
   if(dy>-.4){
    const ex=dx*4.2,ey=-2+dy*2,sep=2.8*(1-.5*Math.abs(dx));
    for(const sd of[-1,1]){const x=ex+sd*sep;ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(x,ey,2.3,2.9,0,0,7);ctx.fill();ctx.strokeStyle='rgba(60,40,10,.6)';ctx.lineWidth=.6;ctx.stroke();ctx.fillStyle='#1a1208';ctx.beginPath();ctx.arc(x+dx*.9,ey+.6,1.2,0,7);ctx.fill();}
    ctx.strokeStyle='#d93a2b';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(ex-3.5,ey-3.6);ctx.lineTo(ex-1,ey-2.6);ctx.moveTo(ex+3.5,ey-3.6);ctx.lineTo(ex+1,ey-2.6);ctx.stroke();
    ctx.fillStyle='#6b2418';ctx.beginPath();ctx.ellipse(ex,ey+5.2,1.9,1+spd*1.4,0,0,7);ctx.fill();
   }
   ctx.restore();
   // arms
   for(const ph of[Math.PI,0]){
    const sw=Math.sin(run+ph)*amp*.9,sx=cx0+(ph?8.8:-8.8),sy=cy0+2,hx=sx+dx*sw*.7+(ph?2:-2),hy=sy+8+dy*sw*.5-Math.max(0,Math.cos(run+ph))*2*spd;
    limb(sx,sy,hx,hy,2.8,'#efe2bf');ctx.fillStyle='#fafafa';ctx.beginPath();ctx.arc(hx,hy,2.5,0,7);ctx.fill();ctx.strokeStyle='rgba(90,68,30,.5)';ctx.lineWidth=.6;ctx.stroke();
   }
  }
 }
 ctx.restore();
 const c=checks[nextCheck];
 if(c){const dx=c[0]-car.x,dy=c[1]-car.y,a=Math.atan2((dx+dy)*.5,(dx-dy)*.866);ctx.save();ctx.translate(W/2,H/2-26);ctx.rotate(a);ctx.fillStyle='rgba(255,176,0,.9)';ctx.beginPath();ctx.moveTo(62,0);ctx.lineTo(50,-6);ctx.lineTo(50,6);ctx.fill();ctx.restore();}
 const vg=ctx.createRadialGradient(W/2,H/2,90,W/2,H/2,300);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(12,8,0,.5)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='rgba(255,205,130,.05)';ctx.fillRect(0,0,W,H);
}
function loop(now){
 const dt=Math.min(.033,(now-last)/1000);last=now;
 if(running&&car)step(dt);
 draw();
 if(car&&running){$('tm').textContent=Math.max(0,time).toFixed(1);$('sp').textContent=Math.round((car._sp||0)*.9);$('cp').textContent=nextCheck+'/'+checks.length;}
 requestAnimationFrame(loop);
}
// override overlay buttons for next/retry flows
const origShow=showMsg;
showMsg=function(h,p,btn){origShow(h,p,btn);$('go').onclick=()=>{ $('msg').style.display='none'; if(over==='won')stage=0; startStage(); };};
requestAnimationFrame(loop);
</script>
